[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcp-rbffd"
version = "0.1.0"
description = "Stages 1-5 prototype for complementary preconditioning of RBF-FD systems"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
ml = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
